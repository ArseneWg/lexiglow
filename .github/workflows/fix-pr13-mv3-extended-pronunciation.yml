name: Fix PR 13 MV3 pronunciation loader

on:
  push:
    branches:
      - fix/default-lexical-pronunciation-ux

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-lexical-pronunciation-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply MV3-safe loader patch
        run: node scripts/fix-pr13-mv3-loader.mjs
      - name: Regenerate pinned pronunciation data and packaged JSON
        run: npm run refresh:pronunciation-data
      - name: Remove temporary files
        run: |
          rm .github/workflows/fix-pr13-mv3-extended-pronunciation.yml
          rm scripts/fix-pr13-mv3-loader.mjs
          rm -f README.pr13-verification.md
      - name: Commit product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Load extended pronunciation data safely in MV3"
          git push origin HEAD:fix/default-lexical-pronunciation-ux
