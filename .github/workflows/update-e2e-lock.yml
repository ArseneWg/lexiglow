name: Update E2E lockfile

on:
  push:
    branches: [test/browser-e2e]

permissions:
  contents: write

jobs:
  update-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test/browser-e2e

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Use npm 11
        run: npm install --global npm@11

      - name: Refresh package lock
        run: npm install --package-lock-only --ignore-scripts

      - name: Commit lockfile and remove one-shot workflow
        run: |
          rm .github/workflows/update-e2e-lock.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json .github/workflows/update-e2e-lock.yml
          git commit -m "Lock Playwright E2E dependency"
          git push origin HEAD:test/browser-e2e
