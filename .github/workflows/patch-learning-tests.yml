name: Patch learning tests

on:
  push:
    branches: [fix/review-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-hardening
      - name: Patch legacy test fixture
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          path = Path('tests/translator.test.ts')
          text = path.read_text()
          pattern = re.compile(r'  test\("sends the full analysis sentence without trimContext truncation".*?\n  test\("reads structured analysis payload"', re.S)
          replacement = r'''  test("sends the full analysis sentence without trimContext truncation", async () => {
            const longSentence = ` ${"A".repeat(230)} ${"B".repeat(90)} `;
            const normalizedSentence = longSentence.trim();
            const firstToken = "A".repeat(230);
            const fetchMock = vi.fn().mockResolvedValue({
              ok: true,
              json: async () => ({
                choices: [
                  {
                    finish_reason: "stop",
                    message: {
                      content: JSON.stringify({
                        translation: "完整译文。",
                        structure: "main clause",
                        analysisSteps: ["一", "二", "三", "四"],
                        highlights: [{ category: "subject", text: firstToken, tokenIndex: 0 }],
                        clauseBlocks: [`main|||${normalizedSentence}`],
                      }),
                    },
                  },
                ],
              }),
            });
            vi.stubGlobal("fetch", fetchMock);

            await analyzeSentenceWithLlm({
              text: longSentence,
              settings: {
                defaultTranslationProvider: "google",
                llmProvider: "openai",
                providerBaseUrl: "https://example.com/v1",
                providerModel: "test-model",
                apiKey: "test-key",
                fallbackToGoogle: true,
                learnerLanguageCode: "ko",
                llmDisplayMode: "word",
                cacheDurationValue: 30,
                cacheDurationUnit: "minutes",
              },
            });

            const [, request] = fetchMock.mock.calls[0] as [string, RequestInit];
            const payload = JSON.parse(String(request.body)) as {
              messages: Array<{ role: string; content: string }>;
            };

            expect(payload.messages[0]?.content).toContain("Korean (ko)");
            expect(payload.messages[0]?.content).toContain(
              "Keep person names, usernames, brand names, and product names in their original English form",
            );
            expect(payload.messages.at(-1)?.content).toContain(`sentence: ${normalizedSentence}`);
            expect(payload.messages.at(-1)?.content).toContain(`tokens: 0:${firstToken}`);
          });

          test("reads structured analysis payload"'''
          next_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'expected one test block, patched {count}')
          path.write_text(next_text)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-learning-tests.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update sentence analysis quality test"
          git push origin HEAD:fix/review-hardening
