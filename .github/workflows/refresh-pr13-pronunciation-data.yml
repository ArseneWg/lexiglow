name: Refresh PR 13 pronunciation data

on:
  push:
    branches:
      - fix/default-lexical-pronunciation-ux

permissions:
  contents: write

jobs:
  refresh:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-lexical-pronunciation-ux
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Refresh generated pronunciation data
        run: npm run refresh:pronunciation-data
      - name: Remove one-shot workflow
        run: rm .github/workflows/refresh-pr13-pronunciation-data.yml
      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refresh measuring pronunciation fallback data"
          git push origin HEAD:fix/default-lexical-pronunciation-ux
