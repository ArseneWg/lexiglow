name: Apply foundation code patch

on:
  push:
    branches: [hardening/data-release-races]
    paths:
      - .github/workflows/apply-foundation-code.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/data-release-races

      - name: Apply code patch
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, count))

          replace("src/shared/types.ts", "export interface UserSettings {\n  knownBaseRank: number;", "export interface UserSettings {\n  schemaVersion: number;\n  knownBaseRank: number;")
          replace("src/shared/settings.ts", "export const DEFAULT_SETTINGS: UserSettings = {\n  knownBaseRank: DEFAULT_KNOWN_BASE_RANK,", "export const CURRENT_USER_SETTINGS_SCHEMA_VERSION = 2;\n\nexport const DEFAULT_SETTINGS: UserSettings = {\n  schemaVersion: CURRENT_USER_SETTINGS_SCHEMA_VERSION,\n  knownBaseRank: DEFAULT_KNOWN_BASE_RANK,")
          replace("src/shared/settings.ts", "  return {\n    knownBaseRank,\n    masteredOverrides,", "  return {\n    schemaVersion: CURRENT_USER_SETTINGS_SCHEMA_VERSION,\n    knownBaseRank,\n    masteredOverrides,")
          replace("src/shared/storage.ts", 'import { DEFAULT_SETTINGS, sanitizeSettings } from "./settings";', 'import { CURRENT_USER_SETTINGS_SCHEMA_VERSION, DEFAULT_SETTINGS, sanitizeSettings } from "./settings";')
          replace("src/shared/storage.ts", "  if (localSettings) {\n    return sanitizeSettings(localSettings);\n  }", "  if (localSettings) {\n    const sanitized = sanitizeSettings(localSettings);\n    if (localSettings.schemaVersion !== CURRENT_USER_SETTINGS_SCHEMA_VERSION) {\n      await chrome.storage.local.set({\n        [STORAGE_SETTINGS_KEY]: sanitized,\n      });\n    }\n    return sanitized;\n  }")

          replace("src/options/main.ts", 'import { LEXICON_WORDS, lookupRank, resolveLookupLemma } from "../shared/lexicon";\n', 'import { LEXICON_WORDS, lookupRank, resolveLookupLemma } from "../shared/lexicon";\nimport {\n  createLearningDataExport,\n  MAX_LEARNING_DATA_IMPORT_BYTES,\n  mergeImportedTranslatorSecrets,\n  parseLearningDataExport,\n  serializeLearningDataExport,\n} from "../shared/learningData";\n')
          replace("src/options/main.ts", 'import { getSettings, getTranslatorSettingsState, saveSettings } from "../shared/storage";', 'import {\n  getSettings,\n  getTranslatorSettingsState,\n  saveSettings,\n  saveTranslatorSettingsState,\n} from "../shared/storage";')
          replace("src/options/main.ts", "let ignoredList!: HTMLElement;\nlet clearButton!: HTMLButtonElement;", "let ignoredList!: HTMLElement;\nlet exportDataButton!: HTMLButtonElement;\nlet importDataButton!: HTMLButtonElement;\nlet importDataInput!: HTMLInputElement;\nlet clearButton!: HTMLButtonElement;")
          replace("src/options/main.ts", '  ignoredList = document.querySelector<HTMLElement>("#ignoredList")!;\n  clearButton = document.querySelector<HTMLButtonElement>("#clearButton")!;', '  ignoredList = document.querySelector<HTMLElement>("#ignoredList")!;\n  exportDataButton = document.querySelector<HTMLButtonElement>("#exportDataButton")!;\n  importDataButton = document.querySelector<HTMLButtonElement>("#importDataButton")!;\n  importDataInput = document.querySelector<HTMLInputElement>("#importDataInput")!;\n  clearButton = document.querySelector<HTMLButtonElement>("#clearButton")!;')

          helpers = '''function downloadLearningDataExport() {\n  const bundle = createLearningDataExport(settings, translatorSettingsState);\n  const blob = new Blob([serializeLearningDataExport(bundle)], { type: "application/json" });\n  const url = URL.createObjectURL(blob);\n  const link = document.createElement("a");\n  const date = new Date().toISOString().slice(0, 10);\n  link.href = url;\n  link.download = `lexiglow-learning-data-${date}.json`;\n  link.click();\n  window.setTimeout(() => URL.revokeObjectURL(url), 0);\n  showSettingsStatus("success", ui("optionsExportDataSuccess"), 2600);\n}\n\nasync function importLearningDataFile(file: File) {\n  if (file.size > MAX_LEARNING_DATA_IMPORT_BYTES) {\n    throw new Error("Learning data file is too large.");\n  }\n\n  const parsed = parseLearningDataExport(await file.text());\n  const nextTranslatorState = mergeImportedTranslatorSecrets(parsed.translatorSettingsState, translatorSettingsState);\n  await saveSettings(parsed.userSettings);\n  await saveTranslatorSettingsState(nextTranslatorState);\n  settings = await getSettings();\n  setTranslatorSettingsState(await getTranslatorSettingsState());\n  renderShell();\n  renderAll();\n  showSettingsStatus("success", ui("optionsImportDataSuccess"), 3200);\n}\n\n'''
          replace("src/options/main.ts", "function bindEvents() {", helpers + "function bindEvents() {")
          replace("src/options/main.ts", "  clearButton.addEventListener(\"click\", async () => {\n    await persistSettings(clearLearningProgress(settings));\n  });", "  exportDataButton.addEventListener(\"click\", () => {\n    downloadLearningDataExport();\n  });\n\n  importDataButton.addEventListener(\"click\", () => {\n    importDataInput.value = \"\";\n    importDataInput.click();\n  });\n\n  importDataInput.addEventListener(\"change\", async () => {\n    const file = importDataInput.files?.[0];\n    if (!file) return;\n    showSettingsStatus(\"pending\", ui(\"optionsImportDataPending\"));\n    try {\n      await importLearningDataFile(file);\n    } catch {\n      showSettingsStatus(\"error\", ui(\"optionsImportDataFailed\"));\n    }\n  });\n\n  clearButton.addEventListener(\"click\", async () => {\n    await persistSettings(clearLearningProgress(settings));\n  });")

          panel = '''      <section class="panel">\n        <h2>${ui("optionsDataBackup")}</h2>\n        <p class="muted">${ui("optionsDataBackupDescription")}</p>\n        <p class="muted">${ui("optionsDataBackupNoSecrets")}</p>\n        <div class="word-actions">\n          <button class="primary" id="exportDataButton" type="button">${ui("optionsExportData")}</button>\n          <button class="secondary" id="importDataButton" type="button">${ui("optionsImportData")}</button>\n          <input id="importDataInput" type="file" accept="application/json,.json" hidden />\n        </div>\n        <p class="settings-status" role="status" aria-live="polite"></p>\n      </section>\n'''
          replace("src/options/main.ts", '      <section class="panel">\n        <h2>${ui("optionsReset")}</h2>', panel + '      <section class="panel">\n        <h2>${ui("optionsReset")}</h2>')

          replace("src/shared/i18n.ts", '  optionsResetButton: "Reset learning progress",', '  optionsResetButton: "Reset learning progress",\n  optionsDataBackup: "Backup and restore",\n  optionsDataBackupDescription: "Export your long-term learning state and non-secret translator profile settings, or restore them from a previous LexiGlow backup.",\n  optionsDataBackupNoSecrets: "API keys are never included in exported backup files.",\n  optionsExportData: "Export learning data",\n  optionsImportData: "Import learning data",\n  optionsExportDataSuccess: "Learning data exported.",\n  optionsImportDataPending: "Importing learning data...",\n  optionsImportDataSuccess: "Learning data imported.",\n  optionsImportDataFailed: "Import failed. Check that this is a valid LexiGlow backup.",')
          replace("src/shared/i18n.ts", '    optionsResetButton: "重置学习进度",', '    optionsResetButton: "重置学习进度",\n    optionsDataBackup: "备份与恢复",\n    optionsDataBackupDescription: "导出长期学习状态和不含秘密的翻译配置，或从之前的 LexiGlow 备份恢复。",\n    optionsDataBackupNoSecrets: "导出的备份文件永远不会包含 API Key。",\n    optionsExportData: "导出学习数据",\n    optionsImportData: "导入学习数据",\n    optionsExportDataSuccess: "学习数据已导出。",\n    optionsImportDataPending: "正在导入学习数据...",\n    optionsImportDataSuccess: "学习数据已导入。",\n    optionsImportDataFailed: "导入失败，请确认文件是有效的 LexiGlow 备份。",')
          replace("package.json", '    "test": "vitest run",\n    "test:e2e": "playwright test"', '    "test": "vitest run",\n    "test:e2e": "playwright test",\n    "test:e2e:network": "playwright test e2e/network-resilience.spec.ts",\n    "release:package": "node scripts/package-release.mjs"')

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src package.json
          git commit -m "Add versioned learning backup foundation"
          git push origin HEAD:hardening/data-release-races
