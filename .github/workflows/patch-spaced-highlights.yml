name: Patch spaced highlights

on:
  push:
    branches: [fix/review-hardening]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/review-hardening
      - name: Apply spaced highlight rules
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          settings_path = Path('src/shared/settings.ts')
          text = settings_path.read_text()
          pattern = re.compile(r'export function getHighlightIntensity\(.*?\n\}\n\nexport function recordLearningExposure', re.S)
          replacement = '''export function getHighlightIntensity(\n  settings: UserSettings,\n  surface: string,\n  articleOccurrences = 1,\n): HighlightIntensity {\n  const key = resolveMasteryKey(surface);\n  const progress = key ? settings.learningProgress[key] : undefined;\n\n  if (progress?.status === "learning") {\n    const due = (progress.nextReviewAt ?? 0) <= Date.now();\n    if (due || progress.exposures <= 1) {\n      return "strong";\n    }\n\n    if (progress.exposures >= 6 && progress.familiarity >= 0.75) {\n      return articleOccurrences >= 3 ? "weak" : "none";\n    }\n    if (progress.exposures >= 4 || progress.familiarity >= 0.55) {\n      return articleOccurrences >= 3 ? "normal" : "weak";\n    }\n    return articleOccurrences >= 3 ? "strong" : "normal";\n  }\n\n  return articleOccurrences >= 3 ? "strong" : "normal";\n}\n\nexport function recordLearningExposure'''
          next_text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
            raise SystemExit(f'expected one highlight rule block, patched {count}')
          settings_path.write_text(next_text)

          highlighter_path = Path('src/content/highlightEngine.ts')
          highlighter = highlighter_path.read_text()
          highlighter = highlighter.replace(
            'export const PENDING_HIGHLIGHT_NAMES: Record<HighlightIntensity, string> = {',
            'export const PENDING_HIGHLIGHT_NAMES: Record<Exclude<HighlightIntensity, "none">, string> = {',
          )
          highlighter = highlighter.replace(
            '    intensity: HighlightIntensity,',
            '    intensity: Exclude<HighlightIntensity, "none">,',
          )
          old = '''      const intensity = getHighlightIntensity(settings, candidate.surface, articleOccurrences);\n      const added = addRange('''
          new = '''      const intensity = getHighlightIntensity(settings, candidate.surface, articleOccurrences);\n      if (intensity === "none") {\n        continue;\n      }\n      const added = addRange('''
          if old not in highlighter:
            raise SystemExit('missing intensity addRange site')
          highlighter = highlighter.replace(old, new, 1)
          highlighter_path.write_text(highlighter)
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/patch-spaced-highlights.yml
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use spaced review to control highlight exposure"
          git push origin HEAD:fix/review-hardening
