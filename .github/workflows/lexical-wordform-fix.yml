name: Fix lexical word-form ownership

on:
  push:
    branches:
      - fix/pronunciation-real-world

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pronunciation-real-world
      - name: Keep lexical word-form metadata owned by the resolved translation
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('src/background/index.ts')
          s = p.read_text()
          old = '''      partOfSpeech,\n      wordFormLabel: describeEnglishWordForm(surface, lemma, partOfSpeech),\n      rank,\n'''
          new = '''      partOfSpeech,\n      rank,\n'''
          if old not in s:
              raise SystemExit('word-form ownership anchor missing')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Remove temporary workflow
        run: rm .github/workflows/lexical-wordform-fix.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Keep lexical word-form metadata authoritative"
          git push origin HEAD:fix/pronunciation-real-world
