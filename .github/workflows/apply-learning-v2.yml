name: Apply learning engine v2

on:
  push:
    branches: [fix/review-hardening]

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/review-hardening

      - name: Apply source migrations
        run: node scripts/apply-learning-v2.mjs

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply-learning-v2.mjs
          rm .github/workflows/apply-learning-v2.yml

      - name: Commit migration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Refactor learning and analysis engine"
          git push origin HEAD:fix/review-hardening
