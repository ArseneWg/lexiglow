name: Site Smoke

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

concurrency:
  group: site-smoke-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build extension
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Live public-site smoke
        run: npm run test:e2e:sites

      - name: Upload site-smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-site-smoke-diagnostics
          path: |
            playwright-site-report
            test-results/site-smoke
          if-no-files-found: ignore
          retention-days: 7
