name: Apply tooltip session code patch

on:
  push:
    branches: [hardening/data-release-races]
    paths:
      - .github/workflows/apply-tooltip-session-code.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/data-release-races

      - name: Apply tooltip session patch
        shell: python
        run: |
          from pathlib import Path

          path = Path("src/content/index.ts")
          text = path.read_text()

          def replace(old, new, count=1):
              global text
              if old not in text:
                  raise SystemExit(f"missing patch anchor: {old[:100]!r}")
              text = text.replace(old, new, count)

          replace(
              'import { createIncrementalHighlightEngine, PENDING_HIGHLIGHT_NAMES } from "./highlightEngine";\n',
              'import { createIncrementalHighlightEngine, PENDING_HIGHLIGHT_NAMES } from "./highlightEngine";\nimport {\n  createTooltipSession,\n  HIDDEN_TOOLTIP_SESSION,\n  isAnalysisTooltipSession,\n  isPersistentTooltipSessionState,\n  isSelectionTooltipSession,\n  shouldPreserveAnalysisContextOnHide,\n} from "./tooltipSession";\n',
          )
          replace("let analysisPanelOpen = false;", "let tooltipSession = HIDDEN_TOOLTIP_SESSION;")
          replace('let activeWordTooltipSource: "hover-word" | "review-word" | "selection-translate" = "hover-word";\n', "")
          replace(
              'function isPersistentTooltipSession(): boolean {\n  return tooltip.host.style.display === "block" &&\n    (activeWordTooltipSource === "review-word" || activeWordTooltipSource === "selection-translate" || analysisPanelOpen);\n}',
              'function isPersistentTooltipSession(): boolean {\n  return tooltip.host.style.display === "block" && isPersistentTooltipSessionState(tooltipSession);\n}',
          )
          replace(
              'function hideTooltip() {\n  stopActivePronunciationAudio();\n  clearSelectionTriggerTimer();',
              'function hideTooltip() {\n  const preserveAnalysisContext = shouldPreserveAnalysisContextOnHide(tooltipSession);\n  stopActivePronunciationAudio();\n  clearSelectionTriggerTimer();',
          )
          replace('  activeWordTooltipSource = "hover-word";\n', '  tooltipSession = HIDDEN_TOOLTIP_SESSION;\n')
          replace('  if (!analysisPanelOpen) {\n    activeSelectionContext = null;\n  }', '  if (!preserveAnalysisContext) {\n    activeSelectionContext = null;\n  }')
          replace('    activeWordTooltipSource === "selection-translate" ||', '    isSelectionTooltipSession(tooltipSession) ||')

          replace(
              '  activeSelectionTooltipContext = context;\n  activeSelectionContext = context;\n  activeWordTooltipSource = "selection-translate";',
              '  activeSelectionTooltipContext = context;\n  activeSelectionContext = context;\n  tooltipSession = createTooltipSession("selection");',
          )
          replace(
              '  activeContext = null;\n  activeResult = null;\n  analysisPanelOpen = false;\n  positionTooltip(context.rect);',
              '  activeContext = null;\n  activeResult = null;\n  positionTooltip(context.rect);',
          )
          replace(
              '  activeSelectionTooltipContext = null;\n  activeWordTooltipSource = activeContext?.forceTranslate ? "review-word" : "hover-word";',
              '  activeSelectionTooltipContext = null;\n  tooltipSession = createTooltipSession(activeContext?.forceTranslate ? "reviewWord" : "hoverWord");',
          )
          replace('  if (!activeResult?.surface || activeWordTooltipSource === "selection-translate") {', '  if (!activeResult?.surface || isSelectionTooltipSession(tooltipSession)) {')

          replace(
              '    tooltip.analysisTriggerButton.style.display = "none";\n    analysisPanelOpen = false;\n    activeSelectionContext = null;',
              '    tooltip.analysisTriggerButton.style.display = "none";\n    if (isAnalysisTooltipSession(tooltipSession)) {\n      tooltipSession = HIDDEN_TOOLTIP_SESSION;\n    }\n    activeSelectionContext = null;',
          )
          replace(
              '  tooltip.host.style.display = "block";\n  analysisPanelOpen = false;\n  positionSentenceAnalysisButton(context.rect);',
              '  tooltip.host.style.display = "block";\n  tooltipSession = createTooltipSession("analysisPrompt");\n  positionSentenceAnalysisButton(context.rect);',
          )
          text = text.replace('  analysisPanelOpen = true;\n', '  tooltipSession = createTooltipSession("analysis");\n')
          replace('    const hadAnalysisOpen = analysisPanelOpen;', '    const hadAnalysisOpen = isAnalysisTooltipSession(tooltipSession);')
          replace('  if (analysisPanelOpen && activeSelectionContext) {', '  if (tooltipSession.kind === "analysis" && activeSelectionContext) {')

          if "analysisPanelOpen" in text:
              raise SystemExit("analysisPanelOpen remains after session migration")
          if "activeWordTooltipSource" in text:
              raise SystemExit("activeWordTooltipSource remains after session migration")

          path.write_text(text)

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/index.ts
          git commit -m "Use explicit tooltip session state"
          git push origin HEAD:hardening/data-release-races
