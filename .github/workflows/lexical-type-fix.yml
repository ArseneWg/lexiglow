name: Apply lexical type fixes

on:
  push:
    branches:
      - fix/pronunciation-real-world

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pronunciation-real-world

      - name: Apply focused fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('src/shared/translator.ts')
          s = p.read_text()
          old = '''export function parseLlmTranslationResponse(payload: string): {
            translation: string;
            sentenceTranslation?: string;
            englishExplanation?: string;
            contextualPartOfSpeech?: string;
          } {'''.replace('          ', '')
          new = '''export function parseLlmTranslationResponse(payload: string): {
            translation: string;
            sentenceTranslation?: string;
            englishExplanation?: string;
            contextualPartOfSpeech?: string;
            semanticHint?: string;
            alternativeMeanings?: Array<{ meaning: string; semanticHint?: string; partOfSpeech?: string }>;
          } {'''.replace('          ', '')
          if old not in s:
              raise SystemExit('parse return-type anchor missing')
          s = s.replace(old, new, 1)
          old = '.catch(() => ({ surface, lemma: resolveLookupLemma(surface), senses: [] }));'
          new = '.catch(() => ({ surface, lemma: resolveLookupLemma(surface), wordFormLabel: undefined, senses: [] }));'
          if old not in s:
              raise SystemExit('structured fallback anchor missing')
          s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('tests/pronunciation.test.ts')
          s = p.read_text()
          anchor = 'describe("selectVoiceForAccent", () => {\n'
          test = '''describe("tts playback event classification", () => {
            test("does not report a false failure after audible playback starts", () => {
              expect(classifyTtsPlaybackEvent("start", false)).toBe("pending");
              expect(classifyTtsPlaybackEvent("cancelled", true)).toBe("success");
              expect(classifyTtsPlaybackEvent("interrupted", true)).toBe("success");
              expect(classifyTtsPlaybackEvent("cancelled", false)).toBe("failure");
              expect(classifyTtsPlaybackEvent("error", true)).toBe("failure");
              expect(classifyTtsPlaybackEvent("end", true)).toBe("success");
            });
          });

          '''.replace('          ', '')
          if anchor not in s:
              raise SystemExit('pronunciation test anchor missing')
          s = s.replace(anchor, test + anchor, 1)
          p.write_text(s)
          PY

      - name: Remove temporary verification files
        run: |
          rm -f README.lexical-overhaul.md
          rm .github/workflows/lexical-type-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix lexical result types and playback regression test"
          git push origin HEAD:fix/pronunciation-real-world
