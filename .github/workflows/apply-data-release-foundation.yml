name: Apply data and release foundation

on:
  push:
    branches: [hardening/data-release-races]
    paths:
      - .github/workflows/apply-data-release-foundation.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/data-release-races

      - name: Apply schema, backup UI, and release gate
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"missing patch anchor in {path}: {old[:80]!r}")
              text = text.replace(old, new, count)
              p.write_text(text)

          # User settings schema v2.
          replace(
              "src/shared/types.ts",
              "export interface UserSettings {\n  knownBaseRank: number;",
              "export interface UserSettings {\n  schemaVersion: number;\n  knownBaseRank: number;",
          )
          replace(
              "src/shared/settings.ts",
              "export const DEFAULT_SETTINGS: UserSettings = {\n  knownBaseRank: DEFAULT_KNOWN_BASE_RANK,",
              "export const CURRENT_USER_SETTINGS_SCHEMA_VERSION = 2;\n\nexport const DEFAULT_SETTINGS: UserSettings = {\n  schemaVersion: CURRENT_USER_SETTINGS_SCHEMA_VERSION,\n  knownBaseRank: DEFAULT_KNOWN_BASE_RANK,",
          )
          replace(
              "src/shared/settings.ts",
              "  return {\n    knownBaseRank,\n    masteredOverrides,",
              "  return {\n    schemaVersion: CURRENT_USER_SETTINGS_SCHEMA_VERSION,\n    knownBaseRank,\n    masteredOverrides,",
          )

          # Persist legacy local settings after sanitizing them into the current schema.
          replace(
              "src/shared/storage.ts",
              'import { DEFAULT_SETTINGS, sanitizeSettings } from "./settings";',
              'import { CURRENT_USER_SETTINGS_SCHEMA_VERSION, DEFAULT_SETTINGS, sanitizeSettings } from "./settings";',
          )
          replace(
              "src/shared/storage.ts",
              "  if (localSettings) {\n    return sanitizeSettings(localSettings);\n  }",
              "  if (localSettings) {\n    const sanitized = sanitizeSettings(localSettings);\n    if (localSettings.schemaVersion !== CURRENT_USER_SETTINGS_SCHEMA_VERSION) {\n      await chrome.storage.local.set({\n        [STORAGE_SETTINGS_KEY]: sanitized,\n      });\n    }\n    return sanitized;\n  }",
          )

          # Options: import/export helpers and storage writes.
          replace(
              "src/options/main.ts",
              'import { LEXICON_WORDS, lookupRank, resolveLookupLemma } from "../shared/lexicon";\n',
              'import { LEXICON_WORDS, lookupRank, resolveLookupLemma } from "../shared/lexicon";\nimport {\n  createLearningDataExport,\n  MAX_LEARNING_DATA_IMPORT_BYTES,\n  mergeImportedTranslatorSecrets,\n  parseLearningDataExport,\n  serializeLearningDataExport,\n} from "../shared/learningData";\n',
          )
          replace(
              "src/options/main.ts",
              'import { getSettings, getTranslatorSettingsState, saveSettings } from "../shared/storage";',
              'import {\n  getSettings,\n  getTranslatorSettingsState,\n  saveSettings,\n  saveTranslatorSettingsState,\n} from "../shared/storage";',
          )
          replace(
              "src/options/main.ts",
              "let ignoredList!: HTMLElement;\nlet clearButton!: HTMLButtonElement;",
              "let ignoredList!: HTMLElement;\nlet exportDataButton!: HTMLButtonElement;\nlet importDataButton!: HTMLButtonElement;\nlet importDataInput!: HTMLInputElement;\nlet clearButton!: HTMLButtonElement;",
          )
          replace(
              "src/options/main.ts",
              '  ignoredList = document.querySelector<HTMLElement>("#ignoredList")!;\n  clearButton = document.querySelector<HTMLButtonElement>("#clearButton")!;',
              '  ignoredList = document.querySelector<HTMLElement>("#ignoredList")!;\n  exportDataButton = document.querySelector<HTMLButtonElement>("#exportDataButton")!;\n  importDataButton = document.querySelector<HTMLButtonElement>("#importDataButton")!;\n  importDataInput = document.querySelector<HTMLInputElement>("#importDataInput")!;\n  clearButton = document.querySelector<HTMLButtonElement>("#clearButton")!;',
          )

          backup_helpers = r'''
          function downloadLearningDataExport() {
            const bundle = createLearningDataExport(settings, translatorSettingsState);
            const blob = new Blob([serializeLearningDataExport(bundle)], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const link = document.createElement("a");
            const date = new Date().toISOString().slice(0, 10);
            link.href = url;
            link.download = `lexiglow-learning-data-${date}.json`;
            link.click();
            window.setTimeout(() => URL.revokeObjectURL(url), 0);
            showSettingsStatus("success", ui("optionsExportDataSuccess"), 2600);
          }

          async function importLearningDataFile(file: File) {
            if (file.size > MAX_LEARNING_DATA_IMPORT_BYTES) {
              throw new Error("Learning data file is too large.");
            }

            const parsed = parseLearningDataExport(await file.text());
            const nextTranslatorState = mergeImportedTranslatorSecrets(
              parsed.translatorSettingsState,
              translatorSettingsState,
            );
            await saveSettings(parsed.userSettings);
            await saveTranslatorSettingsState(nextTranslatorState);
            settings = await getSettings();
            setTranslatorSettingsState(await getTranslatorSettingsState());
            renderShell();
            renderAll();
            showSettingsStatus("success", ui("optionsImportDataSuccess"), 3200);
          }

          '''
          backup_helpers = "\n".join(line[10:] if line.startswith("          ") else line for line in backup_helpers.splitlines())
          replace("src/options/main.ts", "function bindEvents() {", backup_helpers + "function bindEvents() {")

          replace(
              "src/options/main.ts",
              "  clearButton.addEventListener(\"click\", async () => {\n    await persistSettings(clearLearningProgress(settings));\n  });",
              "  exportDataButton.addEventListener(\"click\", () => {\n    downloadLearningDataExport();\n  });\n\n  importDataButton.addEventListener(\"click\", () => {\n    importDataInput.value = \"\";\n    importDataInput.click();\n  });\n\n  importDataInput.addEventListener(\"change\", async () => {\n    const file = importDataInput.files?.[0];\n    if (!file) return;\n    showSettingsStatus(\"pending\", ui(\"optionsImportDataPending\"));\n    try {\n      await importLearningDataFile(file);\n    } catch {\n      showSettingsStatus(\"error\", ui(\"optionsImportDataFailed\"));\n    }\n  });\n\n  clearButton.addEventListener(\"click\", async () => {\n    await persistSettings(clearLearningProgress(settings));\n  });",
          )

          backup_panel = r'''
                <section class="panel">
                  <h2>${ui("optionsDataBackup")}</h2>
                  <p class="muted">${ui("optionsDataBackupDescription")}</p>
                  <p class="muted">${ui("optionsDataBackupNoSecrets")}</p>
                  <div class="word-actions">
                    <button class="primary" id="exportDataButton" type="button">${ui("optionsExportData")}</button>
                    <button class="secondary" id="importDataButton" type="button">${ui("optionsImportData")}</button>
                    <input id="importDataInput" type="file" accept="application/json,.json" hidden />
                  </div>
                  <p class="settings-status" role="status" aria-live="polite"></p>
                </section>
          '''
          backup_panel = "\n".join(line[10:] if line.startswith("          ") else line for line in backup_panel.splitlines())
          replace(
              "src/options/main.ts",
              '      <section class="panel">\n        <h2>${ui("optionsReset")}</h2>',
              backup_panel + '      <section class="panel">\n        <h2>${ui("optionsReset")}</h2>',
          )

          # Localized backup labels; other languages fall back to English.
          replace(
              "src/shared/i18n.ts",
              '  optionsResetButton: "Reset learning progress",',
              '  optionsResetButton: "Reset learning progress",\n  optionsDataBackup: "Backup and restore",\n  optionsDataBackupDescription: "Export your long-term learning state and non-secret translator profile settings, or restore them from a previous LexiGlow backup.",\n  optionsDataBackupNoSecrets: "API keys are never included in exported backup files.",\n  optionsExportData: "Export learning data",\n  optionsImportData: "Import learning data",\n  optionsExportDataSuccess: "Learning data exported.",\n  optionsImportDataPending: "Importing learning data...",\n  optionsImportDataSuccess: "Learning data imported.",\n  optionsImportDataFailed: "Import failed. Check that this is a valid LexiGlow backup.",',
          )
          replace(
              "src/shared/i18n.ts",
              '    optionsResetButton: "重置学习进度",',
              '    optionsResetButton: "重置学习进度",\n    optionsDataBackup: "备份与恢复",\n    optionsDataBackupDescription: "导出长期学习状态和不含秘密的翻译配置，或从之前的 LexiGlow 备份恢复。",\n    optionsDataBackupNoSecrets: "导出的备份文件永远不会包含 API Key。",\n    optionsExportData: "导出学习数据",\n    optionsImportData: "导入学习数据",\n    optionsExportDataSuccess: "学习数据已导出。",\n    optionsImportDataPending: "正在导入学习数据...",\n    optionsImportDataSuccess: "学习数据已导入。",\n    optionsImportDataFailed: "导入失败，请确认文件是有效的 LexiGlow 备份。",',
          )

          # Package scripts and deterministic release packaging in the PR gate.
          replace(
              "package.json",
              '    "test": "vitest run",\n    "test:e2e": "playwright test"',
              '    "test": "vitest run",\n    "test:e2e": "playwright test",\n    "test:e2e:network": "playwright test e2e/network-resilience.spec.ts",\n    "release:package": "node scripts/package-release.mjs"',
          )
          replace(
              ".github/workflows/ci.yml",
              "      - name: Build extension\n        run: npm run build\n\n      - name: Install Playwright Chromium",
              "      - name: Build extension\n        run: npm run build\n\n      - name: Validate release package\n        run: npm run release:package\n\n      - name: Install Playwright Chromium",
          )

      - name: Remove one-shot workflow
        run: rm .github/workflows/apply-data-release-foundation.yml

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add versioned learning backup and release gate"
          git push origin HEAD:hardening/data-release-races
