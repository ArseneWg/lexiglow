name: Fix PR 13 pronunciation selection

on:
  push:
    branches:
      - fix/default-lexical-pronunciation-ux

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/default-lexical-pronunciation-ux
      - name: Prefer IPA-bearing display variants independently of audio
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/shared/pronunciationResolver.ts')
          text = path.read_text()
          old = '''function selectVariantIds(variants: readonly PronunciationVariant[], partOfSpeech?: string): Partial<Record<PronunciationAccent, string>> {
  const selected: Partial<Record<PronunciationAccent, string>> = {};
  const uk = chooseVariant(variants, "en-GB", partOfSpeech);
  const us = chooseVariant(variants, "en-US", partOfSpeech);
  if (uk) selected["en-GB"] = uk.id;
  if (us) selected["en-US"] = us.id;
  return selected;
}'''
          new = '''function chooseDisplayVariant(
  variants: readonly PronunciationVariant[],
  accent: PronunciationAccent,
  partOfSpeech?: string,
): PronunciationVariant | undefined {
  const accentVariants = variants.filter((variant) => variant.accent === accent);
  const ipaVariants = accentVariants.filter((variant) => Boolean(variant.ipa));
  return chooseVariant(ipaVariants.length ? ipaVariants : accentVariants, accent, partOfSpeech);
}

function selectVariantIds(variants: readonly PronunciationVariant[], partOfSpeech?: string): Partial<Record<PronunciationAccent, string>> {
  const selected: Partial<Record<PronunciationAccent, string>> = {};
  const uk = chooseDisplayVariant(variants, "en-GB", partOfSpeech);
  const us = chooseDisplayVariant(variants, "en-US", partOfSpeech);
  if (uk) selected["en-GB"] = uk.id;
  if (us) selected["en-US"] = us.id;
  return selected;
}'''
          if old not in text:
              raise SystemExit('selection anchor missing')
          path.write_text(text.replace(old, new, 1))
          PY
      - name: Remove one-shot workflow
        run: rm .github/workflows/fix-pr13-pronunciation-selection.yml
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Separate pronunciation display from audio selection"
          git push origin HEAD:fix/default-lexical-pronunciation-ux
