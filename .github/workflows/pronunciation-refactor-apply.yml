name: Finalize Pronunciation Assets

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  finalize:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Generate bounded pinned pronunciation data
        run: node scripts/refresh-pronunciation-data.mjs

      - name: Finalize docs and real-site selection helper
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          readme = Path('README.md')
          text = readme.read_text()
          text = text.replace(
            'The current suite contains 24 user-facing Chromium scenarios.',
            'The current suite contains 30 user-facing Chromium scenarios.',
          )
          text = text.replace(
            'The verified CI baseline is 16 Vitest files / 148 unit tests plus 24 / 24 Playwright Chromium extension E2E tests.',
            'The verified CI baseline is 17 Vitest files / 158 unit tests plus 30 / 30 Playwright Chromium extension E2E tests.',
          )
          old = 'pinned offline CMUdict/Britfone subsets provide reproducible fallback data, common heteronyms are resolved from context/POS when confidence is high'
          new = 'pinned offline CMUdict/Britfone subsets for the top 5,000 frequency words plus explicit edge cases provide bounded reproducible fallback data, common heteronyms are resolved from context/POS when confidence is high'
          text = text.replace(old, new)
          readme.write_text(text)

          zh = Path('README.zh-CN.md')
          text = zh.read_text()
          text = text.replace('当前共有 **24 条 Chromium 用户流程**', '当前共有 **30 条 Chromium 用户流程**')
          text = text.replace(
            '当前验证基线为 **16 个 Vitest 文件 / 148 条单元测试 + 24 / 24 条 Playwright Chromium 扩展 E2E**',
            '当前验证基线为 **17 个 Vitest 文件 / 158 条单元测试 + 30 / 30 条 Playwright Chromium 扩展 E2E**',
          )
          text = text.replace('148 条单元测试、生产构建、两次 release 打包 SHA 一致性校验，以及 24 条真实 Chromium 扩展 E2E', '158 条单元测试、生产构建、两次 release 打包 SHA 一致性校验，以及 30 条真实 Chromium 扩展 E2E')
          heading = '## 浏览器级回归测试'
          if '## 发音准确性' not in text and heading in text:
            section = '''## 发音准确性\n\n- 用户主动选中的单个英文词会直接进入发音解析；词组和整句仍保持翻译/分析流程，不伪造单词 IPA。\n- 发音解析基于 `surface + context + POS`。`record / refuse / lead / read / live / use` 等同形异音词只有在语境足够明确时才自动选择 reading；无法确定时禁用自动播放，不盲猜。\n- Kaikki/Wiktextract 的 IPA、audio、audio-IPA、口音与词性保持为同一个 pronunciation variant，避免把不同 reading 的 IPA 和录音拼在一起。\n- 匹配 reading 的真人 lexical audio 优先于 Chrome TTS；TTS 只作为 fallback，并且始终朗读用户选中的 exact surface。\n- `blocks / dogs / buses / looked / played / wanted` 等规则词形可根据 base phoneme 高置信推导 `/s z ɪz/` 或 `/t d ɪd/`，但绝不复用 base-word audio 冒充变形词录音。\n- IPA 按来源原样展示，不再做 DJ-style 破坏性转换；generic / Canadian 数据不会被冒充标记为 US / UK。\n- 离线 fallback 固定 CMUdict 与 Britfone revision，只打包高频 top 5,000 + 明确 edge-case 词；更低频词继续优先实时结构化数据和 exact-surface TTS，避免 MV3 service worker 体积无界增长。\n\n'''
            text = text.replace(heading, section + heading)
          zh.write_text(text)

          site = Path('e2e/sites/pronunciation-sites.spec.ts')
          text = site.read_text()
          start = text.index('async function selectWord')
          end = text.index('\n\nasync function load', start)
          helper = '''async function selectWord(page: Page, word: string): Promise<boolean> {\n  return page.evaluate(async (target) => {\n    const walker = document.createTreeWalker(document.body, NodeFilter.SHOW_TEXT);\n    let node = walker.nextNode() as Text | null;\n    const pattern = new RegExp("\\\\b" + target + "\\\\b", "i");\n\n    while (node) {\n      const parent = node.parentElement;\n      if (parent && !parent.closest("script, style, noscript, input, textarea, select, option, code, pre")) {\n        const match = (node.textContent || "").match(pattern);\n        const style = getComputedStyle(parent);\n        const parentRect = parent.getBoundingClientRect();\n        const visible =\n          style.display !== "none" &&\n          style.visibility !== "hidden" &&\n          Number(style.opacity || "1") > 0 &&\n          parentRect.width > 0 &&\n          parentRect.height > 0;\n\n        if (visible && match && match.index !== undefined) {\n          parent.scrollIntoView({ block: "center", inline: "nearest" });\n          await new Promise<void>((resolve) => requestAnimationFrame(() => requestAnimationFrame(() => resolve())));\n\n          const range = document.createRange();\n          range.setStart(node, match.index);\n          range.setEnd(node, match.index + match[0].length);\n          const rect = range.getBoundingClientRect();\n          if (rect.width <= 0 || rect.height <= 0) {\n            node = walker.nextNode() as Text | null;\n            continue;\n          }\n\n          const selection = window.getSelection();\n          selection?.removeAllRanges();\n          selection?.addRange(range);\n          document.dispatchEvent(new Event("selectionchange"));\n          document.dispatchEvent(new MouseEvent("mouseup", {\n            bubbles: true,\n            clientX: rect.left + Math.min(4, rect.width / 2),\n            clientY: rect.top + Math.min(4, rect.height / 2),\n          }));\n          return true;\n        }\n      }\n      node = walker.nextNode() as Text | null;\n    }\n    return false;\n  }, word);\n}'''
          site.write_text(text[:start] + helper + text[end:])
          PY

      - name: Commit finalized assets
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No finalization changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/generated/pronunciationData.ts README.md README.zh-CN.md e2e/sites/pronunciation-sites.spec.ts
          git commit -m "Finalize pronunciation assets and site coverage"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
