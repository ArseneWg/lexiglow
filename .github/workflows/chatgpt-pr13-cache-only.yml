name: PR13 Cache Only Fix

on:
  push:
    branches:
      - fix/pr13-cache-only
    paths:
      - .github/workflows/chatgpt-pr13-cache-only.yml

permissions:
  contents: write

jobs:
  apply-test-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/pr13-cache-only
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Apply minimal cache fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from textwrap import dedent

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, got {count}")
              p.write_text(text.replace(old, new, 1))

          # Locale-independent alternative-meaning de-duplication only.
          p = Path("src/shared/lexicalSense.ts")
          text = p.read_text()
          if text.count("toLocaleLowerCase()") != 2:
              raise SystemExit(f"unexpected toLocaleLowerCase count: {text.count('toLocaleLowerCase()')}")
          text = text.replace("toLocaleLowerCase()", "toLowerCase()")

          marker = "function compactGloss(value: string, limit = 118): string | undefined {\n"
          helper = dedent(r'''
          function normalizeLexicalMetadataCacheKeyPart(value: string, limit: number): string {
            return value.replace(/\s+/g, " ").trim().slice(0, limit);
          }

          export function buildLexicalMetadataCacheKey({
            learnerLanguageCode,
            surface,
            partOfSpeech,
            contextText,
            primaryTranslation,
          }: {
            learnerLanguageCode: string;
            surface: string;
            partOfSpeech?: string;
            contextText?: string;
            primaryTranslation?: string;
          }): string {
            return [
              learnerLanguageCode,
              normalizeLexicalMetadataCacheKeyPart(surface, 160).toLowerCase(),
              normalizeLexicalMetadataCacheKeyPart(partOfSpeech ?? "", 48).toLowerCase(),
              normalizeLexicalMetadataCacheKeyPart(contextText ?? "", 600),
              normalizeLexicalMetadataCacheKeyPart(primaryTranslation ?? "", 240).toLowerCase(),
            ].join("::");
          }

          ''')
          if text.count(marker) != 1:
              raise SystemExit("compactGloss marker mismatch")
          text = text.replace(marker, helper + marker, 1)
          p.write_text(text)

          replace_once(
              "src/background/index.ts",
              '''import {
            buildStructuredLexicalMetadata,
            describeEnglishWordForm,
            lookupStructuredLexicalSenses,
          } from "../shared/lexicalSense";''',
              '''import {
            buildLexicalMetadataCacheKey,
            buildStructuredLexicalMetadata,
            describeEnglishWordForm,
            lookupStructuredLexicalSenses,
          } from "../shared/lexicalSense";''',
          )

          replace_once(
              "src/background/index.ts",
              '''  const contextText = message.payload.contextText?.trim() ?? "";
            const partOfSpeech = message.payload.partOfSpeech?.trim() || undefined;
            const translatorSettings = await getTranslatorSettings();
            const cacheKey = [
              translatorSettings.learnerLanguageCode,
              surface.toLowerCase(),
              partOfSpeech || "",
              contextText,
            ].join("::");''',
              '''  const contextText = message.payload.contextText?.trim() ?? "";
            const partOfSpeech = message.payload.partOfSpeech?.trim() || undefined;
            const primaryTranslation = message.payload.primaryTranslation?.trim() ?? "";
            const translatorSettings = await getTranslatorSettings();
            const cacheKey = buildLexicalMetadataCacheKey({
              learnerLanguageCode: translatorSettings.learnerLanguageCode,
              surface,
              partOfSpeech,
              contextText,
              primaryTranslation,
            });''',
          )

          replace_once(
              "src/background/index.ts",
              '  const result = buildStructuredLexicalMetadata(lookup, message.payload.primaryTranslation || "");',
              '  const result = buildStructuredLexicalMetadata(lookup, primaryTranslation);',
          )

          Path("tests/pr13CacheKeyRegression.test.ts").write_text(dedent(r'''
          import { describe, expect, test } from "vitest";

          import {
            buildLexicalMetadataCacheKey,
            buildStructuredLexicalMetadata,
          } from "../src/shared/lexicalSense";

          describe("PR13 lexical metadata cache key", () => {
            test("separates results by primary translation", () => {
              const common = {
                learnerLanguageCode: "zh-CN",
                surface: "predictions",
                partOfSpeech: "noun",
                contextText: "The predictions match the benchmark.",
              };
              expect(buildLexicalMetadataCacheKey({ ...common, primaryTranslation: "预测" }))
                .not.toBe(buildLexicalMetadataCacheKey({ ...common, primaryTranslation: "预言" }));
            });

            test("normalizes whitespace and bounds context length", () => {
              const common = {
                learnerLanguageCode: "zh-CN",
                surface: "predictions",
                primaryTranslation: "预测",
              };
              expect(buildLexicalMetadataCacheKey({ ...common, contextText: "  The   model   predicts.  " }))
                .toBe(buildLexicalMetadataCacheKey({ ...common, contextText: "The model predicts." }));
              const prefix = "x".repeat(600);
              expect(buildLexicalMetadataCacheKey({ ...common, contextText: prefix + "tail-a" }))
                .toBe(buildLexicalMetadataCacheKey({ ...common, contextText: prefix + "tail-b" }));
            });

            test("alternative meaning de-duplication remains case-insensitive", () => {
              const result = buildStructuredLexicalMetadata({
                surface: "ITEM",
                lemma: "item",
                senses: [{
                  partOfSpeech: "noun",
                  gloss: "A thing.",
                  targetMeanings: ["ITEM", "item two"],
                  source: "kaikki",
                }],
              }, "item");
              expect(result.alternativeMeanings?.map((item) => item.meaning)).toEqual(["item two"]);
            });
          });
          ''').lstrip())
          PY

      - name: Diff check
        run: git diff --check && git diff --stat

      - name: Install dependencies
        run: npm ci

      - name: Prepare lexicon
        run: npm run prepare:lexicon

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Browser E2E
        run: npm run test:e2e

      - name: Commit minimal fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/index.ts src/shared/lexicalSense.ts tests/pr13CacheKeyRegression.test.ts
          git commit -m "Fix lexical metadata cache correctness"
          git push origin HEAD:fix/pr13-cache-only
