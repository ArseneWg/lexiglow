name: Apply lexical quality fixes

on:
  push:
    branches:
      - fix/pronunciation-real-world

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/pronunciation-real-world

      - name: Apply lexical quality fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace1(path, old, new):
              p = Path(path)
              s = p.read_text()
              if old not in s:
                  raise SystemExit(f'anchor missing in {path}: {old[:100]!r}')
              p.write_text(s.replace(old, new, 1))

          # Separate learning identity from lexical dictionary identity.
          replace1('src/shared/types.ts',
          '''  contextualPartOfSpeech?: string;\n  semanticHint?: string;\n  alternativeMeanings?: AlternativeMeaning[];\n  provider: string;\n''',
          '''  contextualPartOfSpeech?: string;\n  lexicalLemma?: string;\n  wordFormLabel?: string;\n  semanticHint?: string;\n  alternativeMeanings?: AlternativeMeaning[];\n  provider: string;\n''')
          replace1('src/shared/types.ts',
          '''export interface LexiconLookupResult {\n  lemma: string;\n  surface: string;\n''',
          '''export interface LexiconLookupResult {\n  lemma: string;\n  lexicalLemma?: string;\n  surface: string;\n''')
          replace1('src/shared/types.ts',
          '''  contextualPartOfSpeech?: string;\n  semanticHint?: string;\n  alternativeMeanings?: AlternativeMeaning[];\n  provider: string;\n  updatedAt: number;\n''',
          '''  contextualPartOfSpeech?: string;\n  lexicalLemma?: string;\n  wordFormLabel?: string;\n  semanticHint?: string;\n  alternativeMeanings?: AlternativeMeaning[];\n  provider: string;\n  updatedAt: number;\n''')

          # Probe real lemma candidates instead of trusting the first morphology candidate.
          replace1('src/shared/lexicalSense.ts',
          '''function inferLemma(surface: string, entries: readonly KaikkiEntryLike[]): string {\n  for (const entry of entries) {\n    for (const sense of entry.senses || []) {\n      const formOf = sense.form_of?.find((item) => item.word?.trim())?.word?.trim();\n      if (formOf) return normalizeSurface(formOf);\n    }\n  }\n  return getLemmaCandidates(surface).find((candidate) => normalizeSurface(candidate) !== normalizeSurface(surface)) || normalizeSurface(surface);\n}\n''',
          '''function inferFormOfLemma(entries: readonly KaikkiEntryLike[]): string | undefined {\n  for (const entry of entries) {\n    for (const sense of entry.senses || []) {\n      const formOf = sense.form_of?.find((item) => item.word?.trim())?.word?.trim();\n      if (formOf) return normalizeSurface(formOf);\n    }\n  }\n  return undefined;\n}\n''')
          replace1('src/shared/lexicalSense.ts',
          '''  const exactEntries = normalized ? await fetchEntries(normalized, fetchFn) : [];\n  const lemma = normalized ? inferLemma(normalized, exactEntries) : normalized;\n  const lemmaEntries = lemma && lemma !== normalized ? await fetchEntries(lemma, fetchFn) : [];\n  const scored = collectSenses(\n''',
          '''  const exactEntries = normalized ? await fetchEntries(normalized, fetchFn) : [];\n  let lemma = normalized ? inferFormOfLemma(exactEntries) : normalized;\n  let lemmaEntries: KaikkiEntryLike[] = [];\n\n  if (normalized && !lemma) {\n    const candidates = getLemmaCandidates(normalized)\n      .filter((candidate) => normalizeSurface(candidate) !== normalized)\n      .slice(0, 4);\n    for (const candidate of candidates) {\n      const candidateEntries = await fetchEntries(candidate, fetchFn);\n      if (!candidateEntries.length) continue;\n      lemma = normalizeSurface(candidate);\n      lemmaEntries = candidateEntries;\n      break;\n    }\n  }\n\n  lemma ||= normalized;\n  if (lemma && lemma !== normalized && !lemmaEntries.length) {\n    lemmaEntries = await fetchEntries(lemma, fetchFn);\n  }\n\n  const scored = collectSenses(\n''')
          replace1('src/shared/lexicalSense.ts',
          '''  return {\n    surface,\n    lemma: lemma || normalized,\n    wordFormLabel: describeEnglishWordForm(surface, lemma || normalized, options.partOfSpeech),\n    senses,\n  };\n''',
          '''  const lexicalPos = options.partOfSpeech\n    || exactEntries.find((entry) => normalizePos(entry.pos))?.pos\n    || lemmaEntries.find((entry) => normalizePos(entry.pos))?.pos;\n\n  return {\n    surface,\n    lemma: lemma || normalized,\n    wordFormLabel: describeEnglishWordForm(surface, lemma || normalized, lexicalPos),\n    senses,\n  };\n''')

          # Make all LLM display modes use the same structured sense contract and enough output budget.
          replace1('src/shared/translator.ts',
          '''      `${buildLearnerLevelInstruction(learnerLevel, knownCount)} ` +\n      senseInstruction +\n      senseInstruction +\n''',
          '''      `${buildLearnerLevelInstruction(learnerLevel, knownCount)} ` +\n      senseInstruction +\n''')
          replace1('src/shared/translator.ts',
          '''  if (mode === "sentence") {\n    return (\n      "Translate the target English word or short phrase based on the sentence context. " +\n''',
          '''  if (mode === "sentence") {\n    return (\n      senseInstruction +\n      "Translate the target English word or short phrase based on the sentence context. " +\n''')
          replace1('src/shared/translator.ts',
          '''      maxTokens: needsEnglishExplanation ? 140 : needsSentence ? 96 : 40,\n''',
          '''      maxTokens: needsEnglishExplanation ? 240 : needsSentence ? 220 : 180,\n''')
          replace1('src/shared/translator.ts',
          '''    contextualPartOfSpeech: parsed.contextualPartOfSpeech,\n    semanticHint: parsed.semanticHint,\n''',
          '''    contextualPartOfSpeech: parsed.contextualPartOfSpeech,\n    lexicalLemma: structuredLexicon.lemma || undefined,\n    wordFormLabel: structuredLexicon.wordFormLabel,\n    semanticHint: parsed.semanticHint,\n''')

          # Cache lexical metadata and allow english mode through the same contextual word path.
          replace1('src/background/index.ts',
          '''  responseMode?: "word" | "sentence";\n''',
          '''  responseMode?: "word" | "sentence" | "english";\n''')
          replace1('src/background/index.ts',
          '''  responseMode: "word" | "sentence",\n''',
          '''  responseMode: "word" | "sentence" | "english",\n''')
          replace1('src/background/index.ts',
          '''      contextualPartOfSpeech: cached.contextualPartOfSpeech,\n      semanticHint: cached.semanticHint,\n''',
          '''      contextualPartOfSpeech: cached.contextualPartOfSpeech,\n      lexicalLemma: cached.lexicalLemma,\n      wordFormLabel: cached.wordFormLabel,\n      semanticHint: cached.semanticHint,\n''')
          replace1('src/background/index.ts',
          '''      contextualPartOfSpeech: result.contextualPartOfSpeech,\n      semanticHint: result.semanticHint,\n''',
          '''      contextualPartOfSpeech: result.contextualPartOfSpeech,\n      lexicalLemma: result.lexicalLemma,\n      wordFormLabel: result.wordFormLabel,\n      semanticHint: result.semanticHint,\n''')
          replace1('src/background/index.ts',
          '''    const englishMode = provider === "llm" && translatorSettings?.llmDisplayMode === "english";\n    const translationMode =\n      provider === "llm" && translatorSettings?.llmDisplayMode === "sentence" ? "sentence" : "word";\n''',
          '''    const translationMode: "word" | "sentence" | "english" =\n      provider === "llm" ? (translatorSettings?.llmDisplayMode ?? "word") : "word";\n''')

          start = '''      ...(englishMode\n        ? await (async () => {\n            const explanation = await getOrExplainWordInEnglish(lemma, surface, contextText);\n            return {\n              translation: explanation.meaning,\n              sentenceTranslation: undefined,\n              englishExplanation: explanation.explanation,\n              contextualPartOfSpeech: undefined,\n              translationProvider: explanation.provider,\n              cached: explanation.cached,\n            };\n          })()\n        : await (async () => {\n            const translation = await getOrTranslate(\n              lemma,\n              surface,\n              contextText,\n              provider,\n              translationMode,\n            );\n            return {\n              translation: translation.translation,\n              sentenceTranslation: translation.sentenceTranslation,\n              englishExplanation: translation.englishExplanation,\n              contextualPartOfSpeech: translation.contextualPartOfSpeech,\n              semanticHint: translation.semanticHint,\n              alternativeMeanings: translation.alternativeMeanings,\n              wordFormLabel: describeEnglishWordForm(\n                surface,\n                lemma,\n                translation.contextualPartOfSpeech || partOfSpeech,\n              ),\n              translationProvider: translation.provider,\n              cached: translation.cached,\n            };\n          })()),\n'''
          replacement = '''      ...(await (async () => {\n        const translation = await getOrTranslate(\n          lemma,\n          surface,\n          contextText,\n          provider,\n          translationMode,\n        );\n        return {\n          translation: translation.translation,\n          sentenceTranslation: translation.sentenceTranslation,\n          englishExplanation: translation.englishExplanation,\n          contextualPartOfSpeech: translation.contextualPartOfSpeech,\n          lexicalLemma: translation.lexicalLemma,\n          semanticHint: translation.semanticHint,\n          alternativeMeanings: translation.alternativeMeanings,\n          wordFormLabel: translation.wordFormLabel ?? describeEnglishWordForm(\n            surface,\n            translation.lexicalLemma || lemma,\n            translation.contextualPartOfSpeech || partOfSpeech,\n          ),\n          translationProvider: translation.provider,\n          cached: translation.cached,\n        };\n      })()),\n'''
          replace1('src/background/index.ts', start, replacement)

          # Render lexical dictionary lemma, not the learning/rank identity.
          replace1('src/content/index.ts',
          '''function renderLexicalMeaningDisplay(result?: Pick<LexiconLookupResult,\n  "lemma" | "wordFormLabel" | "semanticHint" | "alternativeMeanings"\n>) {\n''',
          '''function renderLexicalMeaningDisplay(result?: Pick<LexiconLookupResult,\n  "lemma" | "lexicalLemma" | "wordFormLabel" | "semanticHint" | "alternativeMeanings"\n>) {\n''')
          replace1('src/content/index.ts',
          '''  const form = result.wordFormLabel && result.lemma\n    ? result.lemma + " · " + result.wordFormLabel\n    : "";\n''',
          '''  const displayedLemma = result.lexicalLemma || result.lemma;\n  const form = result.wordFormLabel && displayedLemma\n    ? displayedLemma + " · " + result.wordFormLabel\n    : "";\n''')
          replace1('src/content/index.ts',
          '''    contextualPartOfSpeech?: string;\n    lemma?: string;\n    wordFormLabel?: string;\n''',
          '''    contextualPartOfSpeech?: string;\n    lemma?: string;\n    lexicalLemma?: string;\n    wordFormLabel?: string;\n''')
          replace1('src/content/index.ts',
          '''      lemma: result?.lemma || normalizeSingleEnglishWord(context.text),\n      wordFormLabel: result?.wordFormLabel,\n''',
          '''      lemma: result?.lemma || normalizeSingleEnglishWord(context.text),\n      lexicalLemma: result?.lexicalLemma,\n      wordFormLabel: result?.wordFormLabel,\n''')
          replace1('src/content/index.ts',
          '''    contextualPartOfSpeech?: string;\n    lemma?: string;\n    wordFormLabel?: string;\n    semanticHint?: string;\n''',
          '''    contextualPartOfSpeech?: string;\n    lemma?: string;\n    lexicalLemma?: string;\n    wordFormLabel?: string;\n    semanticHint?: string;\n''')
          replace1('src/content/index.ts',
          '''          contextualPartOfSpeech: response.result.contextualPartOfSpeech,\n          lemma: response.result.lemma,\n          wordFormLabel: response.result.wordFormLabel,\n''',
          '''          contextualPartOfSpeech: response.result.contextualPartOfSpeech,\n          lemma: response.result.lemma,\n          lexicalLemma: response.result.lexicalLemma,\n          wordFormLabel: response.result.wordFormLabel,\n''')

          # Correct test mocks: openAiResponse already returns serialized JSON.
          for path in ['e2e/lexical-meaning.spec.ts', 'e2e/sites/lexical-meaning-sites.spec.ts']:
              p = Path(path)
              s = p.read_text()
              s = s.replace('body: JSON.stringify(openAiResponse(JSON.stringify({', 'body: openAiResponse(JSON.stringify({')
              s = s.replace('      }))),\n', '      })),\n')
              p.write_text(s)

          # Add a lemma-probing regression without relying on form_of metadata.
          p = Path('tests/lexicalSense.test.ts')
          s = p.read_text()
          anchor = '''  test("follows form-of metadata to the lemma and ranks contextual senses", async () => {\n'''
          new_test = '''  test("probes later lemma candidates when the first morphology candidate has no dictionary entry", async () => {\n    const fetchMock = vi.fn(async (input: RequestInfo | URL) => {\n      const url = String(input);\n      if (url.endsWith("/collapses.jsonl") || url.endsWith("/collaps.jsonl")) {\n        return { ok: url.endsWith("/collapses.jsonl"), text: async () => url.endsWith("/collapses.jsonl")\n          ? JSON.stringify({ word: "collapses", pos: "verb", senses: [] })\n          : "" };\n      }\n      if (url.endsWith("/collapse.jsonl")) {\n        return { ok: true, text: async () => JSON.stringify({\n          word: "collapse", pos: "verb", senses: [{ glosses: ["to fail completely"] }],\n        }) };\n      }\n      return { ok: false, text: async () => "" };\n    });\n\n    const result = await lookupStructuredLexicalSenses("collapses", {\n      contextText: "The mechanism collapses under the constraint.",\n      learnerLanguageCode: "zh-CN",\n      fetchFn: fetchMock as never,\n    });\n    expect(result.lemma).toBe("collapse");\n    expect(result.wordFormLabel).toBe("3sg");\n  });\n\n'''
          if anchor not in s:
              raise SystemExit('lexicalSense test anchor missing')
          p.write_text(s.replace(anchor, new_test + anchor, 1))
          PY

      - name: Remove temporary workflow
        run: rm .github/workflows/lexical-quality-fix.yml

      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete contextual lexical resolution"
          git push origin HEAD:fix/pronunciation-real-world
