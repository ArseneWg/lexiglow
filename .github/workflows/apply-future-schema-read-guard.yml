name: Apply future schema read guard

on:
  push:
    branches: [hardening/data-release-races]
    paths:
      - .github/workflows/apply-future-schema-read-guard.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hardening/data-release-races

      - name: Preserve future-schema records during reads
        shell: python
        run: |
          from pathlib import Path
          path = Path("src/shared/storage.ts")
          text = path.read_text()
          old = """    if (localSettings.schemaVersion !== CURRENT_USER_SETTINGS_SCHEMA_VERSION) {
      await chrome.storage.local.set({
        [STORAGE_SETTINGS_KEY]: sanitized,
      });
    }
"""
          new = """    const storedSchemaVersion = typeof localSettings.schemaVersion === "number"
      ? localSettings.schemaVersion
      : 0;
    if (storedSchemaVersion < CURRENT_USER_SETTINGS_SCHEMA_VERSION) {
      await chrome.storage.local.set({
        [STORAGE_SETTINGS_KEY]: sanitized,
      });
    }
"""
          if old not in text:
              raise SystemExit("missing schema migration writeback anchor")
          path.write_text(text.replace(old, new, 1))

      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/shared/storage.ts
          git commit -m "Preserve future settings schema records on read"
          git push origin HEAD:hardening/data-release-races
