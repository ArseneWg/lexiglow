name: Apply default lexical pronunciation hotfix

on:
  push:
    branches:
      - fix/default-lexical-pronunciation-ux

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: fix/default-lexical-pronunciation-ux

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply product hotfix
        run: node scripts/apply-default-lexical-pronunciation-hotfix.mjs

      - name: Refresh pinned pronunciation tiers
        run: npm run refresh:pronunciation-data

      - name: Remove one-shot applicator
        run: |
          rm scripts/apply-default-lexical-pronunciation-hotfix.mjs
          rm .github/workflows/default-lexical-pronunciation-hotfix.yml

      - name: Commit applied changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix default lexical UX and pronunciation coverage"
          git push origin HEAD:fix/default-lexical-pronunciation-ux
